<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NHAI Toll Analytics</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>NHAI Toll Plaza Analytics</h1>
    <p id="source">Loading…</p>
    <button id="refreshBtn">Refresh data</button>
  </header>

  <main>
    <section class="cards">
      <div class="card"><span id="plazas">–</span><small>Toll plazas</small></div>
      <div class="card"><span id="states">–</span><small>States</small></div>
      <div class="card"><span id="avgFee">–</span><small>Avg car fee</small></div>
      <div class="card"><span id="maxFee">–</span><small>Highest car fee</small></div>
    </section>

    <h2>Graphs</h2>
    <section class="charts" id="charts"></section>

    <h2>Toll plaza data</h2>
    <label>State:
      <select id="stateSelect"><option value="">All</option></select>
    </label>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Plaza</th><th>State</th><th>NH</th><th>Length (km)</th>
          <th>Car</th><th>LCV</th><th>Bus/Truck</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <h2>Cleaning report</h2>
    <pre id="report"></pre>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
